<svg xmlns="http://www.w3.org/2000/svg" width="420" height="170" viewBox="0 0 420 170" role="img" aria-labelledby="title description">
  <title id="title">A quiet motto</title>
  <desc id="description">不必耀眼，先勇敢地发出自己的声音。</desc>
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9d174d" />
      <stop offset="0.52" stop-color="#d62952" />
      <stop offset="1" stop-color="#e8795e" />
    </linearGradient>
    <clipPath id="write-on">
      <rect x="15" y="61" width="390" height="50">
        <animate attributeName="width" from="0" to="390" dur="4.8s" begin="0.3s" fill="freeze" />
      </rect>
    </clipPath>
  </defs>
  <path d="M42 43C105 22 311 22 378 43" fill="none" stroke="#d62952" stroke-opacity="0.16" />
  <text x="210" y="51" text-anchor="middle" fill="#a55b70" font-family="Georgia, 'Times New Roman', serif" font-size="11" letter-spacing="3">A NOTE TO SELF</text>
  <text x="210" y="99" text-anchor="middle" fill="url(#ink)" font-family="'STKaiti', 'KaiTi', 'FZKai-Z03', 'Noto Serif CJK SC', cursive" font-size="28" font-style="italic" clip-path="url(#write-on)">不必耀眼，先勇敢地发声。</text>
  <path d="M76 124C150 136 270 136 344 124" fill="none" stroke="url(#ink)" stroke-width="2" stroke-linecap="round" />
  <circle cx="66" cy="124" r="3" fill="#d62952" />
  <circle cx="354" cy="124" r="3" fill="#e8795e" />
</svg>
