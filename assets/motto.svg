<svg xmlns="http://www.w3.org/2000/svg" width="480" height="180" viewBox="0 0 480 180" role="img" aria-labelledby="title description">
  <title id="title">A quiet motto</title>
  <desc id="description">不必耀眼，先勇敢地发声。</desc>
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9d174d" />
      <stop offset="0.52" stop-color="#d62952" />
      <stop offset="1" stop-color="#e8795e" />
    </linearGradient>
    <clipPath id="write-on">
      <rect x="10" y="62" width="460" height="54">
        <animate attributeName="width" from="0" to="460" dur="4.8s" begin="0.3s" fill="freeze" />
      </rect>
    </clipPath>
    <style>
      @font-face {
        font-family: 'Zhi Mang Xing';
        src: url('zhi-mang-xing.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
      }
    </style>
  </defs>
  <path d="M44 44H436" fill="none" stroke="#d62952" stroke-opacity="0.16" />
  <text x="240" y="53" text-anchor="middle" fill="#a55b70" font-family="Georgia, 'Times New Roman', serif" font-size="12" letter-spacing="3">A NOTE TO SELF</text>
  <text x="240" y="108" text-anchor="middle" fill="url(#ink)" font-family="'Zhi Mang Xing', cursive" font-size="40" font-style="normal" clip-path="url(#write-on)">不必耀眼，先勇敢地发声。</text>
  <path d="M88 137H392" fill="none" stroke="url(#ink)" stroke-width="2" stroke-linecap="round" />
</svg>
