  <path d="M82 84H678" stroke="#d7264f" stroke-opacity="0.16" />
  <path d="M82 84H178M582 84H678" stroke="url(#red)" stroke-linecap="round" />
  <use href="#red-girl" x="18" y="0" />
  <use href="#blue-girl" x="72" y="0" />
  <use href="#pink-girl" x="650" y="0" />
  <use href="#blonde-girl" x="704" y="0" />

  <text x="380" y="49" fill="url(#red)" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="20" text-anchor="middle">不必耀眼，先勇敢地发出自己的声音。</text>
