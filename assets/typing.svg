<svg xmlns="http://www.w3.org/2000/svg" width="760" height="108" viewBox="0 0 760 108" role="img" aria-labelledby="title description">
  <title id="title">Four pixel musicians and a quiet thought</title>
  <desc id="description">Four small pixel characters inspired by a rock band, surrounding a reflective sentence.</desc>
  <defs>
