name: Generate contribution snake

on:
  schedule:
    - cron: "21 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: yunyancuo
          outputs: |
            assets/github-snake.svg?color_snake=%23dd4f6b&color_dots=%23ebedf0,%23f7d9dd,%23f0aebc,%23e77f94,%23dd4f6b
            assets/github-snake-dark.svg?color_snake=%23dd4f6b&color_dots=%23161b22,%233a2731,%236e3a4d,%23a84963,%23dd4f6b
      - name: Commit snake to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-snake.svg assets/github-snake-dark.svg
          git diff --cached --quiet || git commit -m "Update contribution snake"
          git push
