name: Generate contribution snake

on:
  schedule:
    - cron: "21 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: yunyancuo
          outputs: |
            assets/github-snake.svg?color_snake=%23e9709c&color_dots=%23ffe3ec,%23ffb3d1,%23ff8ac2,%23f76aa7,%23e9458a
            assets/github-snake-dark.svg?color_snake=%23ff8ac2&color_dots=%232b2135,%234a2b48,%237a3a67,%23b34a86,%23eb6ba8
      - name: Commit snake to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-snake.svg assets/github-snake-dark.svg
          git diff --cached --quiet || git commit -m "Update contribution snake"
          git push
