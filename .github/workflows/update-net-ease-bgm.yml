name: Update NetEase BGM

on:
  schedule:
    - cron: "13 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  update-bgm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Start NetEase API wrapper
        run: |
          nohup npx --yes NeteaseCloudMusicApi@4.32.0 > /tmp/netease-api.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:3000/ >/dev/null && exit 0
            sleep 2
          done
          cat /tmp/netease-api.log
          exit 1

      - name: Fetch latest liked song
        id: update
        env:
          NETEASE_UID: "1591928592"
          NETEASE_COOKIE: ${{ secrets.NETEASE_COOKIE }}
          NETEASE_API_BASE: "http://127.0.0.1:3000"
        run: python scripts/update_netease_bgm.py

      - name: Commit README update
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md player-data.json assets/
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update today's BGM"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && break || sleep 3
          done
          git push origin main

      - name: Notify cookie expired
        if: failure() && steps.update.outcome == 'failure'
        uses: actions/github-script@v9
        with:
          script: |
            const title = "NetEase BGM sync failed"
            const today = new Date().toISOString().slice(0, 10)
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "cookie-expired", creator: "github-actions[bot]"
            })
            const issue = existing.data.find(i => i.title === title)
            if (issue) {
              // Only comment once per day
              const comments = await github.rest.issues.listComments({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, per_page: 5
              })
              const todayComments = comments.data.filter(c =>
                c.created_at.startsWith(today) && c.user.login === "github-actions[bot]"
              )
              if (todayComments.length === 0) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `${today} — Cookie expired. Run "python scripts/qr_login.py" locally to refresh.`
                })
              }
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, labels: ["cookie-expired"],
                body: `Cookie expired. Refresh locally:

                \`\`\`bash
                pip install qrcode  # optional, for terminal QR display
                python scripts/qr_login.py
                \`\`\`

                Then copy the cookie from netease_cookie.txt to GitHub Secrets → NETEASE_COOKIE.`
              })
            }