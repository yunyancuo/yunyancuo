name: Update NetEase BGM

on:
  schedule:
    - cron: "13 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  update-bgm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Fetch latest liked song
        id: update
        env:
          NETEASE_UID: "1591928592"
          NETEASE_COOKIE: ${{ secrets.NETEASE_COOKIE }}
        run: python scripts/update_netease_bgm.py
      - name: Commit README update
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "Update today's BGM"
          git push
      - name: Report failure in GitHub issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const error = fs.existsSync('bgm-error.log')
              ? fs.readFileSync('bgm-error.log', 'utf8').trim()
              : '工作流在获取或更新步骤失败，但没有生成详细错误日志。'
            const title = '网易云 BGM 工作流失败'
            const body = `自动更新“今日 BGM”失败。\n\n错误：\n\`\`\`\n${error}\n\`\`\`\n\n运行记录：${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              creator: 'github-actions[bot]'
            })
            const issue = existing.data.find(item => item.title === title)
            if (issue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              })
            }
